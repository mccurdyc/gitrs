[package]
name = "gitrs"
version = "0.3.6"
authors = ["mccurdyc"]
description = "A simple, opinionated, tool, written in Rust, for declaratively managing Git repos on your machine."
readme = "./README.md"
homepage = "https://github.com/mccurdyc/gitrs"
repository = "https://github.com/mccurdyc/gitrs"
license = "MIT"
keywords = ["git", "repositories", "declarative"]
edition = "2024"
proc-macro = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
git2 = { version = "0.21.0", features = ["ssh"] }
home = "0.5.12"
log = { version = "0.4.33", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.5"
tempfile = "3.27.0"
walkdir = "2.5.0"
base64 = "0.23.1"
ssh2 = "0.9.6"
